  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">

background:white; border-radius:20px; padding:20px 22px; border:1px solid oklch(0.9 0.005 90);\">\n          <div style=\"font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color: oklch(0.45 0.01 90); margin-bottom:14px;\">Krok 1 · Wybierz przedmiot<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <sc-for list=\"{{ subjects }}\" as=\"subj\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ subj.onClick }}\" style=\"{{ subj.style }}\">\n                {{ subj.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- STEP 2: unit -->\n        <div style=\"background:white; border-radius:20px; padding:20px 22px; border:1px solid oklch(0.9 0.005 90);\">\n          <div style=\"font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color: oklch(0.45 0.01 90); margin-bottom:14px;\">Krok 2 · Wybierz jednostkę<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ units }}\" as=\"u\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ u.onClick }}\" style=\"{{ u.style }}\">\n                {{ u.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- COLUMN 2: value + prefixes -->\n      <div style=\"flex: 0 0 340px; min-width:340px; display:flex; flex-direction:column; gap:20px;\">\n\n        <!-- STEP 3: value -->\n        <div style=\"background:white; border-radius:20px; padding:20px 22px; border:1px solid oklch(0.9 0.005 90);\">\n          <div style=\"font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color: oklch(0.45 0.01 90); margin-bottom:14px;\">Krok 3 · Wartość do przeliczenia<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:12px;\">\n r>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PREFIX_DEFS = [\n  { name: 'giga', sym: 'G', exp: 9 },\n  { name: 'mega', sym: 'M', exp: 6 },\n  { name: 'kilo', sym: 'k', exp: 3 },\n  { name: 'hekto', sym: 'h', exp: 2 },\n  { name: 'deka', sym: 'da', exp: 1 },\n  { name: '', sym: '', exp: 0 },\n  { name: 'decy', sym: 'd', exp: -1 },\n  { name: 'centy', sym: 'c', exp: -2 },\n  { name: 'mili', sym: 'm', exp: -3 },\n  { name: 'mikro', sym: 'µ', exp: -6 },\n];\n\nfunction pickSet(baseLabel, baseSym, exps) {\n  return PREFIX_DEFS.filter(p => exps.includes(p.exp)).map(p => ({\n    label: p.name ? p.name + baseLabel : baseLabel,\n    sym: p.sym + baseSym,\n    prefixSym: p.sym || null,\n    baseUnitSym: baseSym,\n    num: p.exp >= 0 ? Math.pow(10, p.exp) : 1,\n    den: p.exp >= 0 ? 1 : Math.pow(10, -p.exp),\n  }));\n}\n\nconst FAMILIES = {\n  dlugosc: { name: 'Długość', baseSym: 'm', variants: pickSet('metr', 'm', [3, 0, -1, -2, -3]) },\n  masa: {\n    name: 'Masa', baseSym: 'g',\n    variants: [\n      { label: 'tona', sym: 't', num: 1e6, den: 1, special: true, via: { sym: 'kg', numFactor: 1000, denFactor: 1 } },\n      ...pickSet('gram', 'g', [3, 1, 0, -3]),\n    ],\n  },\n  czas: {\n    name: 'Czas', baseSym: 's',\n    variants: [\n      { label: 'sekunda', sym: 's', prefixSym: null, baseUnitSym: 's', num: 1, den: 1 },\n      { label: 'minuta', sym: 'min', num: 60, den: 1, special: true },\n      { label: 'godzina', sym: 'godz', num: 3600, den: 1, special: true },\n    ],\n  },\n  pole: {\n    name: 'Pole powierzchni', baseSym: 'm²',\n    variants: [\n      { label: 'metr kwadratowy', sym: 'm²', num: 1, den: 1, power: 2, linear: { sym: 'm', factor: 1 } },\n      { label: 'decymetr kwadratowy', sym: 'dm²', num: 1, den: 100, power: 2, linear: { sym: 'dm', factor: 0.1 } },\n      { label: 'centymetr kwadratowy', sym: 'cm²', num: 1, den: 1e4, power: 2, linear: { sym: 'cm', factor: 0.01 } },\n      { label: 'milimetr kwadratowy', sym: 'mm²', num: 1, den: 1e6, power: 2, linear: { sym: 'mm', factor: 0.001 } },\n      { label: 'ar', sym: 'a', num: 1e2, den: 1, special: true, power: 2, linear: { sym: 'dam', factor: 10 } },\n      { label: 'hektar', sym: 'ha', num: 1e4, den: 1, special: true, power: 2, linear: { sym: 'hm', factor: 100 } },\n    ],\n  },\n  objetoscPojemnosc: {\n    name: 'Objętość i pojemność', baseSym: 'dm³',\n    variants: [\n      { label: 'metr sześcienny', sym: 'm³', num: 1000, den: 1, power: 3, linear: { sym: 'm', factor: 10 } },\n      { label: 'decymetr sześcienny', sym: 'dm³', num: 1, den: 1, power: 3, linear: { sym: 'dm', factor: 1 } },\n      { label: 'centymetr sześcienny', sym: 'cm³', num: 1, den: 1000, power: 3, linear: { sym: 'cm', factor: 0.1 } },\n      { label: 'milimetr sześcienny', sym: 'mm³', num: 1, den: 1e6, power: 3, linear: { sym: 'mm', factor: 0.01 } },\n      { label: 'litr', sym: 'l', num: 1, den: 1 },\n      { label: 'hektolitr', sym: 'hl', num: 100, den: 1, via: { sym: 'l', numFactor: 100, denFactor: 1 } },\n      { label: 'decylitr', sym: 'dl', num: 1, den: 10, via: { sym: 'l', numFactor: 1, denFactor: 10 } },\n      { label: 'centylitr', sym: 'cl', num: 1, den: 100, via: { sym: 'l', numFactor: 1, denFactor: 100 } },\n      { label: 'mililitr', sym: 'ml', num: 1, den: 1000, via: { sym: 'l', numFactor: 1, denFactor: 1000 } },\n    ],\n  },\n  gestosc: {\n    name: 'Gęstość', baseSym: 'kg/m³',\n    variants: [\n      { label: 'kilogram na metr sześcienny', sym: 'kg/m³', num: 1, den: 1 },\n      { label: 'gram na centymetr sześcienny', sym: 'g/cm³', num: 1000, den: 1, special: true },\n    ],\n  },\n  mol: {\n    name: 'Ilość materii', baseSym: 'mol',\n    variants: [\n      { label: 'mol', sym: 'mol', prefixSym: null, baseUnitSym: 'mol', num: 1, den: 1 },\n      { label: 'milimol', sym: 'mmol', prefixSym: 'm', baseUnitSym: 'mol', num: 1, den: 1000 },\n    ],\n  },\n  sila: {\n    name: 'Siła', baseSym: 'N',\n    variants: [\n      { label: 'kiloniuton', sym: 'kN', prefixSym: 'k', baseUnitSym: 'N', num: 1000, den: 1 },\n      { label: 'niuton', sym: 'N', prefixSym: null, baseUnitSym: 'N', num: 1, den: 1 },\n    ],\n  },\n  energia: {\n    name: 'Energia, praca, ciepło', baseSym: 'J',\n    variants: [\n      { label: 'kilodżul', sym: 'kJ', prefixSym: 'k', baseUnitSym: 'J', num: 1000, den: 1 },\n      { label: 'dżul', sym: 'J', prefixSym: null, baseUnitSym: 'J', num: 1, den: 1 },\n    ],\n  },\n  moc: {\n    name: 'Moc', baseSym: 'W',\n    variants: [\n      { label: 'kilowat', sym: 'kW', prefixSym: 'k', baseUnitSym: 'W', num: 1000, den: 1 },\n      { label: 'wat', sym: 'W', prefixSym: null, baseUnitSym: 'W', num: 1, den: 1 },\n    ],\n  },\n  cisnienie: {\n    name: 'Ciśnienie', baseSym: 'Pa',\n    variants: [\n      { label: 'kilopaskal', sym: 'kPa', prefixSym: 'k', baseUnitSym: 'Pa', num: 1000, den: 1 },\n      { label: 'hektopaskal', sym: 'hPa', prefixSym: 'h', baseUnitSym: 'Pa', num: 100, den: 1 },\n      { label: 'paskal', sym: 'Pa', prefixSym: null, baseUnitSym: 'Pa', num: 1, den: 1 },\n    ],\n  },\n  czestotliwosc: {\n    name: 'Częstotliwość', baseSym: 'Hz',\n    variants: [\n      { label: 'kiloherc', sym: 'kHz', prefixSym: 'k', baseUnitSym: 'Hz', num: 1000, den: 1 },\n      { label: 'herc', sym: 'Hz', prefixSym: null, baseUnitSym: 'Hz', num: 1, den: 1 },\n    ],\n  },\n  predkosc: {\n    name: 'Prędkość', baseSym: 'm/s',\n    variants: [\n      { label: 'metr na sekundę', sym: 'm/s', num: 1, den: 1 },\n      { label: 'kilometr na godzinę', sym: 'km/h', num: 1000, den: 3600, special: true },\n    ],\n  },\n};\n\nconst SECTIONS = {\n  matematyka: {\n    label: 'Matematyka', color: 'oklch(0.55 0.16 255)', soft: 'oklch(0.96 0.02 255)',\n    units: [\n      { key: 'm_dlugosc', family: 'dlugosc', label: 'Długość (metry)' },\n      { key: 'm_pole', family: 'pole', label: 'Pole powierzchni (metry kwadratowe, ary)' },\n      { key: 'm_objetosc_pojemnosc', family: 'objetoscPojemnosc', label: 'Objętość (metry sześcienne) i pojemność (litry)' },\n      { key: 'm_masa', family: 'masa', label: 'Masa (kilogramy, tony)' },\n      { key: 'm_czas', family: 'czas', label: 'Czas (sekunda, minuta, godzina)' },\n      { key: 'm_predkosc', family: 'predkosc', label: 'Prędkość (m/s, km/h)' },\n    ],\n  },\n  fizyka: {\n    label: 'Fizyka', color: 'oklch(0.55 0.16 300)', soft: 'oklch(0.96 0.02 300)',\n    units: [\n      { key: 'f_dlugosc', family: 'dlugosc', label: 'Długość (metry)' },\n      { key: 'f_masa', family: 'masa', label: 'Masa (kilogram)' },\n      { key: 'f_czas', family: 'czas', label: 'Czas (sekunda)' },\n      { key: 'f_predkosc', family: 'predkosc', label: 'Prędkość (m/s, km/h)' },\n      { key: 'f_sila', family: 'sila', label: 'Siła (niuton)' },\n      { key: 'f_energia', family: 'energia', label: 'Energia, praca, ciepło (dżul)' },\n      { key: 'f_moc', family: 'moc', label: 'Moc (wat)' },\n      { key: 'f_cisnienie', family: 'cisnienie', label: 'Ciśnienie (paskal)' },\n      { key: 'f_czestotliwosc', family: 'czestotliwosc', label: 'Częstotliwość (herc)' },\n    ],\n  },\n  chemia: {\n    label: 'Chemia', color: 'oklch(0.55 0.16 150)', soft: 'oklch(0.96 0.03 150)',\n    units: [\n      { key: 'c_masa', family: 'masa', label: 'Masa (gram, kilogram)' },\n      { key: 'c_objetosc_pojemnosc', family: 'objetoscPojemnosc', label: 'Objętość (metry sześcienne) i pojemność (litry)' },\n      { key: 'c_mol', family: 'mol', label: 'Ilość materii (mol)' },\n      { key: 'c_gestosc', family: 'gestosc', label: 'Gęstość (kg/m³, g/cm³)' },\n    ],\n  },\n};\n\nconst PRESET_VALUES = [0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000];\n\nfunction predkoscToggleDefaults(familyKey, variants, fIdx, tIdx) {\n  if (familyKey !== 'predkosc') return {};\n  const fSym = variants[fIdx] && variants[fIdx].sym;\n  const tSym = variants[tIdx] && variants[tIdx].sym;\n  if (fSym === 'm/s' && tSym === 'km/h') return { showFrac: false, showExp: false };\n  if (fSym === 'km/h' && tSym === 'm/s') return { showDec: false, showExp: false };\n  return {};\n}\n\nfunction dlugoscFracDefault(familyKey, variants, fIdx, tIdx) {\n  if (familyKey !== 'dlugosc') return {};\n  const fV = variants[fIdx], tV = variants[tIdx];\n  if (!fV || !tV) return {};\n  const fromFactor = fV.num / fV.den, toFactor = tV.num / tV.den;\n  // smaller starting prefix → larger target prefix (fractional result): uncheck fraction form\n  return { showFrac: fromFactor >= toFactor };\n}\n\nfunction reduceFactor(num, den) {\n  const g = gcd(num, den);\n  return { num: num / g, den: den / g };\n}\n\nfunction decimalToFraction(v) {\n  if (v === 0) return { num: 0, den: 1 };\n  if (Number.isInteger(v)) return { num: v, den: 1 };\n  const s = Math.abs(v).toString();\n  if (s.includes('e') || s.includes('E')) {\n    const den = 1e6;\n    return reduceFactor(Math.round(v * den), den);\n  }\n  const dot = s.indexOf('.');\n  if (dot === -1) return { num: v, den: 1 };\n  const decimals = s.length - dot - 1;\n  const den = Math.pow(10, decimals);\n  const num = Math.round(v * den);\n  return reduceFactor(num, den);\n}\n\nfunction fmtGrouped(n) {\n  const str = fmtDecimal(n);\n  const [intPart, decPart] = str.split(',');\n  const grouped = intPart.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ');\n  return decPart !== undefined ? `${grouped},${decPart}` : grouped;\n}\n\nfunction isTerminating(den) {\n  let d = Math.abs(Math.round(den));\n  if (d === 0) return true;\n  while (d % 2 === 0) d /= 2;\n  while (d % 5 === 0) d /= 5;\n  return d === 1;\n}\n\nfunction textPart(text, color, italic) { return { isText: true, isFrac: false, text, color: color || 'inherit', italic: italic ? 'italic' : 'normal' }; }\nfunction fracPart(num, den, color) { return { isText: false, isFrac: true, num, den, color: color || 'inherit' }; }\nfunction parseUnitFrac(sym) {\n  const map = {\n    'm/s': ['m', 's'],\n    'km/h': ['km', 'h'],\n    'kg/m³': ['kg', 'm³'],\n    'g/cm³': ['g', 'cm³'],\n  };\n  return map[sym] || null;\n}\nfunction unitPart(sym, color) {\n  const pair = parseUnitFrac(sym);\n  if (!pair) return textPart(sym, color);\n  return { isText: false, isFrac: false, isUnitFrac: true, num: pair[0], den: pair[1], color: color || 'inherit' };\n}\nfunction factorPart(f, color) {\n  return f.den === 1 ? textPart(String(f.num), color) : fracPart(f.num, f.den, color);\n}\n\nfunction gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }\n\nfunction fmtDecimal(n, sig) {\n  if (!isFinite(n)) return '—';\n  sig = sig || 10;\n  let r = parseFloat(n.toPrecision(sig));\n  let str;\n  if (Math.abs(r) !== 0 && (Math.abs(r) < 1e-6 || Math.abs(r) >= 1e15)) {\n    str = r.toFixed(20);\n  } else {\n    str = r.toString();\n    if (str.includes('e') || str.includes('E')) str = r.toFixed(20);\n  }\n  if (str.includes('.')) str = str.replace(/0+$/, '').replace(/\\.$/, '');\n  return str.replace('.', ',').replace(/^-/, '−');\n}\n\nfunction superscript(exp) {\n  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };\n  return exp.toString().split('').map(ch => map[ch] || ch).join('');\n}\n\nfunction fmtExp(n) {\n  if (n === 0) return '0';\n  if (!isFinite(n)) return '—';\n  const sign = n < 0 ? '−' : '';\n  const abs = Math.abs(n);\n  let exp = Math.floor(Math.log10(abs));\n  let mantissa = abs / Math.pow(10, exp);\n  mantissa = parseFloat(mantissa.toPrecision(6));\n  if (mantissa >= 10) { mantissa /= 10; exp += 1; }\n  if (mantissa < 1) { mantissa *= 10; exp -= 1; }\n  return `${sign}${fmtDecimal(mantissa)} · 10${superscript(exp)}`;\n}\n\nclass Component extends DCLogic {\n  state = {\n    subject: 'matematyka',\n    unitKey: 'm_dlugosc',\n    fromIdx: 0,\n    toIdx: 3,\n    value: 1,\n    showFrac: true,\n    showDec: true,\n    showExp: false,\n    showInt: true,\n    revealCount: 0,\n    cooldown: 0,\n    resultsUnlocked: false,\n  };\n\n  componentWillUnmount() { clearInterval(this._cd); }\n\n  resetReveal() {\n    clearInterval(this._cd);\n    return { revealCount: 0, cooldown: 0, resultsUnlocked: false };\n  }\n\n  advanceStep(totalFree) {\n    if (this.state.cooldown > 0) return;\n    if (this.state.revealCount < totalFree) {\n      // reveal the next free derivation step (with a short cooldown)\n      this.setState({ revealCount: this.state.revealCount + 1, cooldown: 1 });\n      clearInterval(this._cd);\n      this._cd = setInterval(() => {\n        this.setState(s => {\n          const nc = s.cooldown - 1;\n          if (nc <= 0) { clearInterval(this._cd); return { cooldown: 0 }; }\n          return { cooldown: nc };\n        });\n      }, 1000);\n    } else {\n      // all free steps shown — this extra click reveals the result forms\n      this.setState({ resultsUnlocked: true });\n    }\n  }\n\n  selectSubject(key) {\n    const first = SECTIONS[key].units[0];\n    const fam = FAMILIES[first.family];\n    this.setState({ subject: key, unitKey: first.key, fromIdx: 0, toIdx: Math.max(1, fam.variants.length - 1), ...this.resetReveal() });\n  }\n\n  selectUnit(unitKey, familyKey) {\n    const fam = FAMILIES[familyKey];\n    const fromIdx = 0;\n    const toIdx = Math.max(1, fam.variants.length - 1);\n    let extra = { showDec: true, showExp: false, showFrac: true };\n    if (['masa', 'objetoscPojemnosc', 'pole'].includes(familyKey)) extra.showFrac = false;\n    if (familyKey === 'czas') {\n      const fV = fam.variants[fromIdx], tV = fam.variants[toIdx];\n      const rn = fV.num * tV.den, rd = fV.den * tV.num;\n      if (!isTerminating(rd / gcd(rn, rd))) extra.showDec = false;\n    }\n    Object.assign(extra, predkoscToggleDefaults(familyKey, fam.variants, fromIdx, toIdx));\n    Object.assign(extra, dlugoscFracDefault(familyKey, fam.variants, fromIdx, toIdx));\n    this.setState({ unitKey, fromIdx, toIdx, ...extra, ...this.resetReveal() });\n  }\n\n  setFromIdx(e) { const v = parseInt(e.target.value, 10); this.setState({ fromIdx: Number.isFinite(v) ? v : 0, ...this.resetReveal() }); }\n  setToIdx(e) { const v = parseInt(e.target.value, 10); this.setState({ toIdx: Number.isFinite(v) ? v : 0, ...this.resetReveal() }); }\n\n  setValueFromInput(e) {\n    const v = parseFloat(e.target.value.replace(',', '.'));\n    this.setState({ value: isNaN(v) ? 0 : v, ...this.resetReveal() });\n  }\n\n  setSliderIndex(e) {\n    const idx = parseInt(e.target.value, 10);\n    this.setState({ value: PRESET_VALUES[idx], ...this.resetReveal() });\n  }\n\n  toggleFrac() { this.setState(s => ({ showFrac: !s.showFrac })); }\n  toggleDec() { this.setState(s => ({ showDec: !s.showDec })); }\n  toggleExp() { this.setState(s => ({ showExp: !s.showExp })); }\n  toggleInt() { this.setState(s => ({ showInt: !s.showInt })); }\n\n  renderVals() {\n    const { subject, unitKey, value, showFrac, showDec, showExp, showInt, revealCount, cooldown, resultsUnlocked } = this.state;\n    const section = SECTIONS[subject];\n    const accent = section.color;\n    const accentSoft = section.soft;\n\n    const unitDef = section.units.find(u => u.key === unitKey) || section.units[0];\n    const family = FAMILIES[unitDef.family];\n    const variants = family.variants;\n    const isCzasFamily = unitDef.family === 'czas';\n    const chipSuppressExp = ['masa', 'czas', 'predkosc'].includes(unitDef.family);\n\n    const clampIdx = (i) => {\n      const n = Number.isFinite(i) ? i : 0;\n      return Math.max(0, Math.min(n, variants.length - 1));\n    };\n    const fromIdx = clampIdx(this.state.fromIdx);\n    const toIdx = clampIdx(this.state.toIdx);\n    const fromV = variants[fromIdx];\n    const toV = variants[toIdx];\n\n    const subjects = Object.keys(SECTIONS).map(key => {\n      const s = SECTIONS[key];\n      const active = key === subject;\n      return {\n        key,\n        label: s.label,\n        onClick: () => this.selectSubject(key),\n        style: `padding:14px 26px; border-radius:14px; border:2px solid ${s.color}; font-size:17px; font-weight:700; cursor:pointer; background:${active ? s.color : 'white'}; color:${active ? 'white' : s.color}; transition: all 0.15s;`,\n      };\n    });\n\n    const units = section.units.map(u => {\n      const active = u.key === unitKey;\n      return {\n        key: u.key,\n        label: u.label,\n        onClick: () => this.selectUnit(u.key, u.family),\n        style: `padding:10px 18px; border-radius:12px; border:2px solid ${accent}; font-size:15px; font-weight:600; cursor:pointer; background:${active ? accent : 'white'}; color:${active ? 'white' : accent};`,\n      };\n    });\n\n    const inconvenientFor = (fIdx, tIdx) => {\n      if (!isCzasFamily) return false;\n      const fV = variants[fIdx], tV = variants[tIdx];\n      const rn = fV.num * tV.den, rd = fV.den * tV.num;\n      return !isTerminating(rd / gcd(rn, rd));\n    };\n    const fromOptions = variants.map((v, idx) => {\n      const active = idx === fromIdx;\n      return {\n        idx,\n        text: v.display || v.sym || v.label,\n        onClick: () => {\n          let newToIdx = toIdx;\n          if (idx === toIdx) {\n            newToIdx = variants.findIndex((vv, ii) => ii !== idx);\n            if (newToIdx === -1) newToIdx = toIdx;\n          }\n          const inc = inconvenientFor(idx, newToIdx);\n          const pDef = predkoscToggleDefaults(unitDef.family, variants, idx, newToIdx);\n          const dDef = dlugoscFracDefault(unitDef.family, variants, idx, newToIdx);\n          this.setState({ fromIdx: idx, toIdx: newToIdx, ...(inc ? { showDec: false, showExp: false } : {}), ...pDef, ...dDef, ...this.resetReveal() });\n        },\n        style: `padding:8px 14px; border-radius:10px; border:2px solid ${accent}; font-size:14.5px; font-weight:600; cursor:pointer; background:${active ? accent : 'white'}; color:${active ? 'white' : accent};`,\n      };\n    });\n    const toOptions = variants.map((v, idx) => {\n      const ły\" / \"notacja wykładnicza\" buttons, which are\n    // greyed out until unlock. Only the plain decimal derivation shows during reveal.\n    const chipShowFrac = showFrac && resultsUnlocked;\n    const chipShowExp = showExp && resultsUnlocked;\n    const subLine = (symbolText, fPart, decText, expText, unitSuffix, rawPart, extraStep, simpleSteps, reciprocalStep, swapDecFrac) => {\n      const showDecimal = !!decText;\n      const symbolFrac = parseUnitFrac(symbolText);\n      const showFactorPart = !(fPart.isFrac && (!chipShowFrac || isWhole));\n      const finalExpText = chipShowExp ? expText : null;\n      const showRaw = !!rawPart && chipShowFrac;\n      const unitSuffixFrac = unitSuffix ? parseUnitFrac(unitSuffix) : null;\n      return {\n        isEq: false,\n        isSub: true,\n        symbolText,\n        symbolIsUnitFrac: !!symbolFrac,\n        symbolNum: symbolFrac ? symbolFrac[0] : null,\n        symbolDen: symbolFrac ? symbolFrac[1] : null,\n        factorPart: fPart,\n        showDecimal,\n        decimalText: decText || '',\n        expText: finalExpText,\n        unitSuffix: unitSuffix || null,\n        unitSuffixIsFrac: !!unitSuffixFrac,\n        unitSuffixNum: unitSuffixFrac ? unitSuffixFrac[0] : null,\n        unitSuffixDen: unitSuffixFrac ? unitSuffixFrac[1] : null,\n        primaryWeight: decText ? 400 : 700,\n        showRaw,\n        rawPart: rawPart || null,\n        showFactorPart,\n        decimalTrailingEquals: showDecimal && showFactorPart,\n        rawTrailingEquals: showRaw && (showDecimal || showFactorPart),\n        swapDecFrac: !!swapDecFrac,\n        extraStep: extraStep || null,\n        simpleSteps: simpleSteps || null,\n        reciprocalStep: reciprocalStep || null,\n      };\n    };\n    const chipDecimalText = (f) => {\n      if (f.den === 1 || !isTerminating(f.den)) return null;\n      return fmtDecimal(f.num / f.den, 8);\n    };\n    const chipExpText = (f) => fmtExp(f.num / f.den);\n    const chipExpTextMaybe = (f) => (chipSuppressExp || !chipShowExp) ? null : chipExpText(f);\n    const buildEqParts = (factorPartsArr, unitPartOrText, merge) => {\n      const unitPart = typeof unitPartOrText === 'string' ? textPart(unitPartOrText) : unitPartOrText;\n      const parts = [textPart(`= ${valueStr}`)];\n      factorPartsArr.forEach((fp) => { parts.push(textPart('·')); parts.push(fp); });\n      if (merge !== false && factorPartsArr.length > 0) {\n        const last = factorPartsArr[factorPartsArr.length - 1];\n        if (last.isText && unitPart.isText) {\n          // merge the last numeric factor with the trailing unit into one run,\n          // dropping the separating \"·\" (matches the substitution chip's notation)\n          parts.pop();\n          const mergedColor = last.color !== 'inherit' ? last.color : unitPart.color;\n          parts.push(textPart(last.text + ' ' + unitPart.text, mergedColor));\n          return parts;\n        }\n      }\n      parts.push(textPart('·'));\n      parts.push(unitPart);\n      return parts;\n    };\n    // prefer a plain decimal for the working chain (\"głównie ułamkiem dziesiętnym\"),\n    // falling back to a proper fraction only when the decimal doesn't terminate\n    const mainFactorPart = (f, color) => {\n      if (f.den === 1 || isTerminating(f.den)) return textPart(fmtDecimal(f.num / f.den, 10), color);\n      return fracPart(f.num, f.den, color);\n    };\n    const baseLinearSym = baseSym.replace(/[²³]/g, '');\n    const powerChipLine = (symbolText, steps, finalStep, expText) => ({\n      isEq: false,\n      isSub: false,\n      isPowerSub: true,\n      symbolText,\n      steps,\n      finalStep,\n      expText: chipShowExp ? expText : null,\n    });\n    // for area/volume units (dm², cm³, ha, a…) show the actual squaring/cubing\n    // derivation instead of a flat ratio, e.g. dm² = (dm)² = (0,1m)² = (0,1)²·(m)² = 0,01·m²\n    const buildPowerSteps = (variant, direction) => {\n      const p = variant.power;\n      const sup = p === 2 ? '²' : '³';\n      const lin = variant.linear;\n      if (direction === 'from') {\n        const poweredStr = fmtDecimal(Math.pow(lin.factor, p), 10);\n        const steps = variant.special\n          ? [\n              `(${fmtDecimal(lin.factor)}${baseLinearSym})${sup}`,\n              `(${fmtDecimal(lin.factor)})${sup} · (${baseLinearSym})${sup}`,\n              `${poweredStr} · ${baseLinearSym}${sup}`,\n            ]\n          : [\n              `(${lin.sym})${sup}`,\n              `(${fmtDecimal(lin.factor)}${baseLinearSym})${sup}`,\n              `(${fmtDecimal(lin.factor)})${sup} · (${baseLinearSym})${sup}`,\n              `${poweredStr} · ${baseLinearSym}${sup}`,\n            ];\n        return {\n          steps,\n          finalStep: `${poweredStr} ${baseLinearSym}${sup}`,\n          expText: `${fmtExp(Math.pow(lin.factor, p))} ${baseLinearSym}${sup}`,\n        };\n      }\n      const invLin = 1 / lin.factor;\n      const invPoweredStr = fmtDecimal(Math.pow(invLin, p), 10);\n      return {\n        steps: [\n          `(${fmtDecimal(invLin)}${lin.sym})${sup}`,\n          `(${fmtDecimal(invLin)})${sup} · (${lin.sym})${sup}`,\n          `${invPoweredStr} · ${lin.sym}${sup}`,\n        ],\n        finalStep: `${invPoweredStr} ${lin.sym}${sup}`,\n        expText: `${fmtExp(Math.pow(invLin, p))} ${lin.sym}${sup}`,\n      };\n    };\n    const chainLines = [];\n    chainLines.push(eqLine([textPart(`${valueStr} `), unitPart(fromV.sym), textPart(' = ? '), unitPart(toV.sym)]));\n\n    const runningFactors = []; // array of {num,den} rational factors already substituted\n\n    const expandHops = (variant, direction) => {\n      if (!variant.via) {\n        if (direction === 'from') {\n          return [{ symbolText: variant.sym, resultSym: baseSym, factor: reduceFactor(variant.num, variant.den), raw: { num: variant.num, den: variant.den } }];\n        }\n        return [{ symbolText: baseSym, resultSym: variant.sym, factor: reduceFactor(variant.den, variant.num), raw: { num: variant.den, den: variant.num } }];\n      }\n      const viaVariant = variants.find((v) => v.sym === variant.via.sym);\n      const viaSelfFactor = reduceFactor(viaVariant.num, viaVariant.den); // via-unit relative to base\n      if (direction === 'from') {\n        return [\n          { symbolText: variant.sym, resultSym: viaVariant.sym, factor: reduceFactor(variant.via.numFactor, variant.via.denFactor), raw: { num: variant.via.numFactor, den: variant.via.denFactor } },\n          { symbolText: viaVariant.sym, resultSym: baseSym, factor: viaSelfFactor, raw: { num: viaVariant.num, den: viaVariant.den } },\n        ];\n      }\n      return [\n        { symbolText: baseSym, resultSym: viaVariant.sym, factor: reduceFactor(viaVariant.den, viaVariant.num), raw: { num: viaVariant.den, den: viaVariant.num } },\n        { symbolText: viaVariant.sym, resultSym: variant.sym, factor: reduceFactor(variant.via.denFactor, variant.via.numFactor), raw: { num: variant.via.denFactor, den: variant.via.numFactor } },\n      ];\n    };\n\n    // FROM-side: mirror the TO-side principle — the whole source unit token\n    // (e.g. \"km\") is what gets substituted for its value in base units, like\n    // plugging a number into a variable (π-style), not just a bare prefix letter.\n    // Units with a \"via\" (e.g. tona → kilogram → gram) expand into two hops.\n    if (fromFactor !== 1 || fromV.sym === 'l') {\n      if (fromV.power > 1 && fromV.linear) {\n        const priorParts = runningFactors.map((rf) => mainFactorPart(rf, 'inherit'));\n        chainLines.push(eqLine(buildEqParts(priorParts, unitPart(fromV.sym, accent), false)));\n        const { steps, finalStep, expText } = buildPowerSteps(fromV, 'from');\n        chainLines.push(powerChipLine(fromV.sym, steps, finalStep, expText));\n        const f = reduceFactor(fromV.num, fromV.den);\n        runningFactors.push(f);\n        const coloredParts = runningFactors.map((rf, i) => mainFactorPart(rf, i === runningFactors.length - 1 ? accent : 'inherit'));\n        chainLines.push(eqLine(buildEqParts(coloredParts, unitPart(baseSym, accent))));\n      } else {\n        expandHops(fromV, 'from').forEach((hop, idx) => {\n          const priorParts = runningFactors.map((rf) => mainFactorPart(rf, 'inherit'));\n          chainLines.push(eqLine(buildEqParts(priorParts, unitPart(hop.symbolText, accent), false)));\n          const isKmhFrom = unitDef.family === 'predkosc' && hop.symbolText === 'km/h';\n          const rawPart = (hop.raw.num !== hop.factor.num || hop.raw.den !== hop.factor.den) && !isKmhFrom ? fracPart(hop.raw.num, hop.raw.den) : null;\n          const chipFactorPart = isKmhFrom ? fracPart(hop.raw.num, hop.raw.den) : factorPart(hop.factor);\n          const simpleSteps = isKmhFrom ? [{ numText: '1000 m', denText: '60 min' }, { numText: '1000 m', denText: '3600 s' }] : null;\n          chainLines.push(subLine(hop.symbolText, chipFactorPart, isKmhFrom ? null : chipDecimalText(hop.factor), chipExpTextMaybe(hop.factor), hop.resultSym, rawPart, null, simpleSteps));\n          runningFactors.push(isKmhFrom ? hop.raw : hop.factor);\n          const coloredParts = runningFactors.map((rf, i) => mainFactorPart(rf, i === runningFactors.length - 1 ? accent : 'inherit'));\n          chainLines.push(eqLine(buildEqParts(coloredParts, unitPart(hop.resultSym, accent))));\n        });\n      }\n    }\n\n    // TO-side: we're re-expressing the BASE unit itself in terms of the target\n    // (e.g. m = 100 cm) — here it's the base unit token that gets substituted,\n    // not a bare prefix letter, so the chip legitimately carries the target unit.\n    if (toFactor !== 1 || toV.sym === 'l') {\n      if (toV.power > 1 && toV.linear) {\n        const priorParts = runningFactors.map((rf) => mainFactorPart(rf, 'inherit'));\n        chainLines.push(eqLine(buildEqParts(priorParts, unitPart(baseSym, accent), false)));\n        if (toV.special) {\n          // ha/a: show the forward unit definition first, then a \"więc\" summary\n          // line giving 1 base-unit expressed in the target (decimal/fraction/exp).\n          const { steps, finalStep, expText } = buildPowerSteps(toV, 'from');\n          const invF = reduceFactor(toV.den, toV.num);\n          chainLines.push({\n            isEq: false, isSub: false, isPowerSub: false, isDualChip: true,\n            symbolText: toV.sym, steps, finalStep, expText: chipShowExp ? expText : null,\n            summarySymbolText: `1 ${baseSym}`,\n            summaryFactorPart: chipShowFrac ? factorPart(invF) : null,\n            summaryDecimalText: chipDecimalText(invF),\n            summaryExpText: chipExpTextMaybe(invF),\n            summaryUnitSuffix: toV.sym,\n          });\n        } else {\n          const { steps, finalStep, expText } = buildPowerSteps(toV, 'to');\n          chainLines.push(powerChipLine(baseSym, steps, finalStep, expText));\n        }\n        const invF = reduceFactor(toV.den, toV.num);\n        runningFactors.push(invF);\n        const coloredParts = runningFactors.map((rf, i) => mainFactorPart(rf, i === runningFactors.length - 1 ? accent : 'inherit'));\n        chainLines.push(eqLine(buildEqParts(coloredParts, unitPart(toV.sym, accent))));\n      } else {\n        expandHops(toV, 'to').forEach((hop, idx) => {\n          const priorParts = runningFactors.map((rf) => mainFactorPart(rf, 'inherit'));\n          chainLines.push(eqLine(buildEqParts(priorParts, unitPart(hop.symbolText, accent), false)));\n          const isKmhTo = unitDef.family === 'predkosc' && hop.resultSym === 'km/h';\n          const rawPart = (hop.raw.num !== hop.factor.num || hop.raw.den !== hop.factor.den) && !isKmhTo ? fracPart(hop.raw.num, hop.raw.den) : null;\n          const extraStep = isKmhTo ? { numNum: 1, numDen: 1000, numUnit: 'km', denNum: 1, denDen: 3600, denUnit: 'godziny' } : null;\n          const reciprocalStep = isKmhTo ? { aNum: 1, aDen: 1000, bNum: 3600, bDen: 1, unitNum: 'km', unitDen: 'h' } : null;\n          const chipFactorPart = isKmhTo ? fracPart(hop.raw.num, hop.raw.den) : factorPart(hop.factor);\n          chainLines.push(subLine(hop.symbolText, chipFactorPart, chipDecimalText(hop.factor), chipExpTextMaybe(hop.factor), hop.resultSym, rawPart, extraStep, null, reciprocalStep, isKmhTo));\n          runningFactors.push(hop.factor);\n          const coloredParts = runningFactors.map((rf, i) => mainFactorPart(rf, i === runningFactors.length - 1 ? accent : 'inherit'));\n          chainLines.push(eqLine(buildEqParts(coloredParts, unitPart(hop.resultSym, accent))));\n        });\n      }\n    }\n\n    // Everything pushed so far is a \"free\" derivation step, revealed one-by-one\n    // by the student. Everything pushed below is a button-gated result form that\n    // only appears once all free steps have been revealed and results unlocked.\n    const freeLineCount = chainLines.length;\n    const hiddenFreeCount = Math.max(0, freeLineCount - 1);\n    const resultsShown = hiddenFreeCount === 0 ? true : resultsUnlocked;\n\n    // final forms: pure, already-computed results — no operators or derivation,\n    // just the answer restated in the chosen notation(s).\n    if (resultsShown) {\n    if (isWhole) {\n      if (showInt) chainLines.push(eqLine([textPart(`= ${resultStr} `), unitPart(toV.sym)], 'Liczba całkowita'));\n    } else {\n      const isKmhFromDir = unitDef.family === 'predkosc';\n      const pushDec = () => {\n        if (showDec) chainLines.push(eqLine([textPart(`= ${resultStr} `), unitPart(toV.sym)], 'Ułamek dziesiętny'));\n      };\n      const pushFrac = () => {\n        if (showFrac) {\n          const unreducedDiffers = ratioNum !== rNum || ratioDen !== rDen;\n          chainLines.push(eqLine([textPart(`= ${valueStr}`), textPart('·'), fracPart(ratioNum, ratioDen), textPart('·'), unitPart(toV.sym)], 'Ułamek zwykły'));\n          if (unreducedDiffers) {\n            chainLines.push(eqLine([textPart(`= ${valueStr}`), textPart('·'), fracPart(rNum, rDen), textPart('·'), unitPart(toV.sym)]));\n          }\n          const valFrac = decimalToFraction(value);\n          const finalFrac = reduceFactor(valFrac.num * rNum, valFrac.den * rDen);\n          chainLines.push(eqLine([textPart('='), factorPart(finalFrac), unitPart(toV.sym)]));\n        }\n      };\n      if (isKmhFromDir) { pushFrac(); pushDec(); } else { pushDec(); pushFrac(); }\n    }\n    if (showExp) chainLines.push(eqLine([textPart(`= ${fmtExp(resultValue)} `), unitPart(toV.sym)], 'Notacja wykładnicza'));\n    }\n\n    chainLines.forEach((line, i) => {\n      line.stepLabel = i === 0 ? 'Przykład' : `Krok ${i}`;\n      // free steps (index >= 1, before the gated block) fade in one at a time;\n      // the gated result lines (index >= freeLineCount) are always visible once present\n      const isGated = i >= freeLineCount;\n      const hidden = !isGated && i >= 1 && i > revealCount;\n      line.hidden = hidden;\n      line.rowStyle = hidden ? 'display:none;' : 'display:flex; align-items:center; gap:14px;';\n    });\n\n    const allFreeRevealed = revealCount >= hiddenFreeCount;\n    const showRevealBtn = hiddenFreeCount > 0 && !resultsUnlocked;\n    const totalFree = hiddenFreeCount;\n\n    const toggleBtnStyle = (active, disabled) => `padding:9px 16px; border-radius:10px; border:2px solid ${disabled ? 'oklch(0.85 0.005 90)' : accent}; font-size:14px; font-weight:600; cursor:${disabled ? 'not-allowed' : 'pointer'}; background:${disabled ? 'oklch(0.95 0.003 90)' : (active ? accent : 'white')}; color:${disabled ? 'oklch(0.7 0.005 90)' : (active ? 'white' : accent)};`;\n    const toggles = [];\n    const lockT = !resultsShown;\n    if (isWhole) {\n      toggles.push({ label: 'Liczba całkowita', active: !lockT && showInt, onClick: lockT ? () => {} : () => this.toggleInt(), style: toggleBtnStyle(showInt, lockT) });\n    } else {\n      toggles.push({ label: 'Ułamek dziesiętny', active: !lockT && showDec, onClick: lockT ? () => {} : () => this.toggleDec(), style: toggleBtnStyle(showDec, lockT) });\n      toggles.push({ label: 'Ułamek zwykły', active: !lockT && showFrac, onClick: lockT ? () => {} : () => this.toggleFrac(), style: toggleBtnStyle(showFrac, lockT) });\n    }\n    toggles.push({ label: 'Notacja wykładnicza', active: !lockT && showExp, onClick: lockT ? () => {} : () => this.toggleExp(), style: toggleBtnStyle(showExp, lockT) });\n\n    return {\n      subjectLabel: section.label,\n      subjects,\n      units,\n      fromOptions,\n      toOptions,\n      accent,\n      accentSoft,\n      fromSym: fromV.sym,\n      fromSymFrac: parseUnitFrac(fromV.sym),\n      toSym: toV.sym,\n      value,\n      sliderIndex: (() => {\n        let bestI = 4, bestD = Infinity;\n        PRESET_VALUES.forEach((p, i) => { const d = Math.abs(p - value); if (d < bestD) { bestD = d; bestI = i; } });\n        return bestI;\n      })(),\n      setSliderIndex: (e) => this.setSliderIndex(e),\n      setValueFromInput: (e) => this.setValueFromInput(e),\n      chainLines,\n      toggles,\n      showRevealBtn,\n      revealInCooldown: cooldown > 0,\n      revealCountdown: cooldown,\n      revealRingOffset: 100 - (cooldown / 1) * 100,\n      revealBtnLabel: allFreeRevealed ? 'Pokaż wynik' : 'Pokaż następny krok',\n      revealBtnOnClick: () => this.advanceStep(totalFree),\n      sameUnit: fromIdx === toIdx,\n      sliderLabels: ['0,0001', '0,001', '0,01', '0,1', '1', '10', '100', '1000', '10000'].map((text, i) => ({\n        text,\n        left: `calc(11px + ${i / 8} * (100% - 22px))`,\n      })),\n      prefixTable: PREFIX_DEFS.filter(p => p.name && !['giga', 'mega', 'mikro'].includes(p.name)).map(p => ({\n        name: p.name,\n        sym: p.sym,\n        value: fmtGrouped(p.exp >= 0 ? Math.pow(10, p.exp) : 1 / Math.pow(10, -p.exp)),\n      })),\n      chipStyle: `display:inline-flex; align-items:center; gap:7px; background:white; border:1.5px dashed ${accent}; color:${accent}; border-radius:999px; padding:6px 16px; font-size:0.62em; font-weight:600; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;`,\n      noneSelected: resultsShown && (isWhole ? (!showInt && !showExp) : (!showDec && !showFrac && !showExp)),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
